# Minimal configuration to run the forensic engine (probability.LRMixCalculator) outside
# GENis. LRMixCalculator takes its thread pool from this key; the pedigree engine
# (pedigree.BayesianNetwork) needs no configuration. The pool size differs from the one GENis
# uses and does not affect results: calculateLRMix runs as a single sequential Future.
play.akka.actor.lrmix-context {
  fork-join-executor {
    parallelism-min = 2
    parallelism-max = 8
  }
}
